<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neverwinter Lockbox Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage" class="stage hidden" aria-live="polite">
    <div class="glow-ring" id="glowRing"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="viewer-line">
      <span id="viewerName">Viewer</span>
      <span class="opened-label">opened</span>
      <span id="boxName">Lockbox</span>
    </div>

    <div class="chest-wrap" id="chestWrap">
      <div class="chest" id="chest">
        <img class="chest-art" id="chestArt" src="chest-closed.png" alt="" />
        <div class="chest-shine" id="chestShine"></div>
      </div>
    </div>

    <div class="prize-panel" id="prizePanel">
      <div class="prize-icon-wrap" id="prizeIconWrap">
        <span class="prize-icon-emoji" id="prizeIconEmoji" hidden></span>
        <img class="prize-icon-img" id="prizeIconImg" alt="" hidden />
        <span class="prize-icon-gem" id="prizeIconGem" hidden>💎</span>
      </div>
      <div class="rarity-badge" id="rarityBadge">RARE</div>
      <div class="prize-name" id="prizeName">Prize Name</div>
    </div>

    <div class="inv-flash" id="invFlash" hidden>
      <span id="invFlashText">@viewer inventory: 0 opens</span>
    </div>
  </div>

  <div id="invPanel" class="inv-panel" hidden>
    <div class="inv-panel-title">Recent opens</div>
    <ul id="invList" class="inv-list"></ul>
  </div>

  <div id="status" class="status"></div>
  <script src="app.js"></script>
</body>
</html>
